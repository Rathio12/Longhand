# Publishes a release whenever main has a version in package.json that has no
# release yet. To ship a new version, raise "version" and push.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: See whether this version is already released
        id: version
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
            "v$version is already released. Nothing to do."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-node@v4
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.exists == 'false'
        run: npm ci

      - name: Build the installer
        if: steps.version.outputs.exists == 'false'
        run: npm run dist

      - name: Publish the release
        if: steps.version.outputs.exists == 'false'
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" `
            --title "Longhand $version" `
            --generate-notes `
            "release/Longhand-Setup-$version.exe" `
            "release/Longhand-Setup-$version.exe.blockmap" `
            "release/latest.yml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
